[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "q-one-core"
version = "0.4.1"
description = "Personal state, adaptive transition prediction and auditable decision planning for Q-One."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Q-One contributors"}]
dependencies = []

[project.optional-dependencies]
adaptive = ["numpy>=1.26,<3", "scipy>=1.11,<2"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
qone = "qone_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
